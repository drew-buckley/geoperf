[package]
name = "geoperf"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1.19"
log = "0.4.34"
thiserror = "2.0.21"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0.104"
serde = "1.0.229"
serde_json = "1.0.154"
libffi = "5.2.0"

toshi = { git = "https://github.com/drew-buckley/toshi.git", branch = "init-dev", features = ["static"] }
env_logger = "0.11.11"

[features]
iperf-vendored = ["dep:autotools"]

[build-dependencies]
pkg-config = "0.3.34"
autotools = { version = "0.2.7", optional = true }
